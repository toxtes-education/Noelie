<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exercices STAPS Noélie</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F9;--card:#fff;--ink:#12263A;--mut:#5B6B7D;--acc:#1F4FD8;--acc2:#F2B705;--ok:#13795B;--ko:#C0282D;--line:#D5DDE8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1622;--card:#17243A;--ink:#EAF0F8;--mut:#9FB0C5;--acc:#6B93FF;--acc2:#F2B705;--ok:#4FD1A5;--ko:#FF7B7F;--line:#2B3C57}}
:root[data-theme="dark"]{--bg:#0E1622;--card:#17243A;--ink:#EAF0F8;--mut:#9FB0C5;--acc:#6B93FF;--acc2:#F2B705;--ok:#4FD1A5;--ko:#FF7B7F;--line:#2B3C57}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1,h2,h3{font-family:"Barlow Semi Condensed",system-ui,sans-serif;margin:0;line-height:1.1}
h1{font-size:40px;font-weight:800;letter-spacing:-.5px}
h1 span{background:linear-gradient(transparent 62%,var(--acc2) 62%)}
h2{font-size:22px;margin:26px 0 4px}
p{margin:6px 0}.mut{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 15px Barlow,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font:700 18px "Barlow Semi Condensed",sans-serif;cursor:pointer;margin-top:12px;background:var(--acc);color:#fff}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.tag{font-size:14px;color:var(--mut)}
.q{font:700 24px/1.2 "Barlow Semi Condensed",sans-serif;margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px;font:400 16px/1.35 Barlow,sans-serif;cursor:pointer}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.bad{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 16%,var(--card))}
.fb{border-left:5px solid var(--acc2);background:var(--card);padding:10px 14px;border-radius:0 10px 10px 0;margin:6px 0 4px}
.score{font:800 72px/1 "Barlow Semi Condensed",sans-serif;margin:8px 0}
.miss{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.miss b{display:block;margin-bottom:4px}.miss .a{color:var(--ok)}
.ex{display:block;border-left:4px solid var(--acc);padding:2px 0 2px 10px;margin:8px 0;font-style:italic;color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center}
.lnk{background:none;border:0;color:var(--mut);font:500 14px Barlow,sans-serif;cursor:pointer;text-decoration:underline}
</style></head>
<body><main id="app"></main>
<script>
const G={H:{n:"Histoire du sport",c:{CM1:"CM1 Grèce antique",CM2:"CM2 Éducation antique",CM3:"CM3 Rome",CM4:"CM4 Féodalité"}},
S:{n:"Sociologie du sport",c:{Intro:"Introduction",Inst:"Institutionnalisation",Struc:"Structuration",Offre:"Diversification"}}};
// [matière, cours, question, [bonne réponse, faux, faux, faux], explication]
const Q=[
["H","CM1","D'où vient le mot « sport » ?",["Du vieux français « desport »","De l'anglais « sportsman » du XVIIIe siècle","Du grec « athlos »","Du latin « ludus »"],"« Desport » désigne ce qui détourne du travail ; l'Angleterre du XVe siècle le reprend du français."],
["H","CM1","Quelle est la valeur suprême de la société achéenne ?",["L'arété (force, vaillance, courage, beauté)","L'otium","Le kaloskagathos","La voluptas"],"L'arété, ardeur au combat, doit être prouvée dans les duels comme dans les jeux."],
["H","CM1","Quelle est la date des premiers JO antiques dont on a trouvé la trace ?",["776 av. J.-C.","1200 av. J.-C.","490 av. J.-C.","393 ap. J.-C."],"Les JO durent de 776 av. J.-C. à 393 ap. J.-C., soit près de 1200 ans."],
["H","CM1","Qui sont les Hellanodices à Olympie ?",["Les juges (arbitres) des concours","Les conducteurs de chars","Les prêtres de Zeus","Les vainqueurs du stade"],"Un jury d'Hellanodices est formé pour chaque olympiade."],
["H","CM1","Le marathon était-il une épreuve des JO antiques ?",["Non : il vient de la bataille de Marathon (490 av. J.-C.)","Oui, c'était l'épreuve reine","Oui, réservé aux jeunes","Oui, mais seulement aux Panathénées"],"Le 1er marathon olympique date de 1896 ; sa distance (42,195 km) est fixée en 1908."],
["H","CM2","À Athènes, que se passe-t-il entre 14 et 18 ans ?",["L'éphébie : éducation au gymnase","L'éducation par les femmes de la famille","L'éducation chez un précepteur privé","L'entrée dans l'agogè"],"Prime enfance (0-7 ans) en famille, enfance (7-14 ans) chez des précepteurs privés, puis éphébie."],
["H","CM2","Quelle différence entre le pédotribe et le gymnasiarque ?",["Le pédotribe enseigne les exercices ; le gymnasiarque gère le gymnase","Le pédotribe gère le gymnase ; le gymnasiarque enseigne","Les deux désignent le même métier","Le pédotribe conduit les enfants à l'école"],"Le pédotribe a aussi un rôle de soigneur, de diététicien et d'éducateur."],
["H","CM2","Qui finance le gymnase athénien ?",["Des riches donateurs privés : les évergètes","Les impôts de la cité","Uniquement les familles des éphèbes","Le Conseil des Anciens"],"Être évergète est une situation très valorisante ; il n'y a pas d'impôts pour cela."],
["H","CM2","Comment s'appelle le système d'éducation spartiate, austère et militarisé ?",["L'agogè","L'éphébie","La païdéia","Le gymnase"],"L'agogè est pris en charge par la cité ; la cryptie en est l'épreuve finale."],
["H","CM2","Comment l'éducation des filles à Sparte diffère-t-elle de celle d'Athènes ?",["Elle est organisée par l'État et comprend de l'éducation physique","Elle n'existe pas","Elle se fait au gymnase avec les garçons","Elle est confiée à des esclaves"],"Le but est d'avoir des mères capables d'engendrer des enfants sains, futurs soldats."],
["H","CM3","Que désignent les « certamina » à Rome ?",["Les activités corporelles pratiquées par les citoyens","Les spectacles du cirque","Les combats de gladiateurs","Les batailles navales"],"Les certamina (exercices, thermes) s'opposent aux ludi, jeux de spectacle."],
["H","CM3","Que signifie « panem et circenses » ?",["Du pain et des jeux : l'empereur gagne la popularité et calme le peuple","Interdire les jeux aux plébéiens","Financer les écoles de gladiateurs","La devise des gladiateurs"],"Les spectacles servent à canaliser la violence sociale et maintenir la paix civile."],
["H","CM3","D'où vient la tradition des combats de gladiateurs ?",["Des rites funéraires étrusques","Des courses de chars grecques","Des Jeux olympiques","Des tournois médiévaux"],"Le munus d'origine sacrée devient un ludus profane, public vers 30 ap. J.-C."],
["H","CM3","Dans les thermes, quelle salle correspond à l'eau très chaude ?",["Le caldarium","Le tepidarium","Le frigidarium","L'apodyterium"],"Tepidarium : eau tiède ; frigidarium : eau froide ; apodyterium : vestiaire."],
["H","CM3","En quelle année les JO antiques sont-ils interdits à Olympie ?",["393 ap. J.-C.","476 ap. J.-C.","27 av. J.-C.","776 av. J.-C."],"Après la christianisation de l'Empire ; 476 est la chute de l'Empire romain d'Occident."],
["H","CM4","Que sont les « bellatores » dans la société féodale ?",["Ceux qui combattent : les chevaliers","Ceux qui prient : le clergé","Ceux qui travaillent : paysans et artisans","Les hérauts d'armes"],"Trois ordres (Duby) : oratores, bellatores, laboratores."],
["H","CM4","Quel est l'ordre de formation du chevalier ?",["Page, écuyer, puis chevalier (adoubement)","Écuyer, page, puis chevalier","Chevalier, écuyer, puis page","Page, chevalier, puis écuyer"],"Page vers 7-10 ans, écuyer vers 14 ans, adoubement vers 18-20 ans."],
["H","CM4","Comment se déroule le tournoi médiéval à ses débuts ?",["Combat collectif (cohue) sans limite d'espace ni de temps","Duel à la lance entre deux chevaliers","Jeu d'adresse contre un mannequin","Compétition avec records"],"La joute, elle, est un duel ; les lices n'apparaissent qu'au XIVe siècle."],
["H","CM4","Qu'est-ce que la quintaine ?",["Un jeu équestre visant un poteau, un écu ou un mannequin","Un duel à la lance","La reconstitution d'un passage fortifié","Un combat de part et d'autre d'une barrière"],"C'est un jeu de précision (le « quintan », la « tête de Maure »)."],
["H","CM4","Qu'est-ce qui marque la fin de la chevalerie lourde ?",["Les archers anglais (Crécy, Azincourt) puis les armes à feu","Les invasions vikings","Une interdiction du Pape","Les Grandes Invasions"],"Les chevaliers en armure tombés à terre sont vulnérables ; les fantassins reviennent."],
["S","Intro","Que cherche à comprendre la sociologie selon Durkheim ?",["Comment la société agit sur les individus","Pourquoi les individus agissent ainsi (sens subjectif)","Comment mesurer la performance","Comment les institutions naissent"],"Weber, lui, s'intéresse au sens que les acteurs donnent à leur activité."],
["S","Intro","Qui définit le sport comme « situations motrices codifiées, compétition, institutionnalisées » ?",["Pierre Parlebas","Marcel Mauss","Georges Hébert","Norbert Elias"],"C'est une définition restreinte (1986)."],
["S","Intro","Quelle est la définition large du sport (Irlinger, Louveau, Métoudi, 1987) ?",["Est sport ce que les pratiquants considèrent eux-mêmes comme du sport","Un ensemble de situations motrices codifiées","Tout mouvement demandant une dépense d'énergie","Une lutte contre un élément défini"],"Pas besoin de compétition, de licence ni d'institution. Le 3e choix est la définition de l'OMS."],
["S","Intro","Marcel Mauss qualifie le sport de…",["Phénomène social total","Institution totale","Configuration","Fait de civilisation"],"Le sport engage toutes les dimensions de la société."],
["S","Inst","Qui a théorisé le processus de civilisation appliqué au sport ?",["Norbert Elias (avec Dunning)","Pierre Bourdieu","Émile Durkheim","Pierre Parlebas"],"La violence est davantage régulée et l'autocontrôle intériorisé."],
["S","Inst","Que désigne la sportification ?",["La transformation des jeux traditionnels en sports modernes","La diffusion du sport dans l'éducation physique","La fin des paris sportifs","La professionnalisation des fédérations"],"Elle suppose règles codifiées, compétitions organisées et violence régulée. Le 2e choix correspond plutôt à la « sportivisation » au sens français."],
["S","Inst","Quand la Football Association est-elle créée ?",["1863","1871","1895","1896"],"1871 : Rugby Football Union ; 1895 : scission du rugby."],
["S","Inst","Pourquoi le rugby se scinde-t-il en 1895 ?",["Conflit entre amateurisme et professionnalisme","Désaccord sur la taille du terrain","Querelle entre public schools","Interdiction de porter le ballon"],"Les clubs du Nord ouvrier réclament une compensation pour les journées de salaire perdues : Rugby League (XIII) contre Rugby Union (XV)."],
["S","Inst","Que montrent les premiers combats UFC (années 1990) selon Van Bottenburg et Heilbron ?",["Une dé-sportivisation","Une sportification complète","Une re-sportivisation","Une démocratisation"],"Peu de règles, pas de catégories de poids ; la re-sportivisation vient dans les années 2000."],
["S","Struc","Quels sont les trois secteurs de l'offre sportive ?",["Public, privé non marchand, privé marchand","Scolaire, fédéral, commercial","Amateur, professionnel, loisir","État, régions, communes"],"Typologie de Laure et Falcoz (2004)."],
["S","Struc","Les fédérations sportives sont regroupées au sein…",["Du CNOSF","Du ministère des Sports","Du CIO","De l'INSEP"],"Le Comité national olympique et sportif français."],
["S","Struc","Quelle différence entre acteur et agent social ?",["L'acteur insiste sur le pouvoir d'agir, l'agent sur le poids des conditions sociales","Ce sont des synonymes","L'acteur est un groupe, l'agent un individu","L'acteur est professionnel, l'agent bénévole"],"Deux manières de regarder les individus en sociologie."],
["S","Struc","Quelle logique anime le secteur privé marchand ?",["Une logique commerciale et la recherche de rentabilité","L'intérêt général","Le bénévolat associatif","L'éducation physique"],"Entreprises, sponsoring, médias, salles de fitness."],
["S","Offre","La féminisation des pratiques signifie-t-elle la fin des différences de genre ?",["Non : les activités et modalités de pratique restent différenciées","Oui, les taux de pratique sont identiques","Oui, depuis 2018","Non, car les femmes pratiquent moins"],"En 2025, 61 % des femmes et 62 % des hommes pratiquent régulièrement, mais les différences persistent."],
["S","Offre","Le CrossFit est un exemple de…",["Hybridation (gymnastique, haltérophilie, cardio)","Ludification","Pratique de nature","Sport connecté"],"Autres exemples : Hyrox, Piloxing, Padel, Swimrun."],
["S","Offre","La ludification déplace l'accent…",["De la performance vers le plaisir et la convivialité","Du plaisir vers la performance","Du club vers la fédération","De la santé vers la compétition"],"Exemples : Color Run, courses à obstacles. Les logiques marchandes restent présentes."],
["S","Offre","Selon le baromètre 2025, quelle part des Français pratique régulièrement ?",["61 %","81 %","27 %","72 %"],"72 % pratiquent au moins occasionnellement ; 81 % avec les déplacements actifs."],
["H","CM1","Quel mot grec désigne les concours d'Olympie, plutôt que « jeux » ?",["Agones (agon : confrontation)","Ludi","Certamina","Munera"],"Les Grecs soulignent la dimension compétitive, pas frivole."],
["H","CM1","Que reçoit le vainqueur d'Olympie ?",["Une couronne d'olivier, pour lui seul","Une médaille d'or","Une médaille d'argent","Un trophée de bronze"],"Il n'y a ni médaille ni podium : un seul vainqueur."],
["H","CM1","Quelle épreuve donne son nom à l'olympiade ?",["La course du stade (stadion)","Le pentathle","Le pancrace","La course de chars"],"Son vainqueur est l'olympionique."],
["H","CM1","Quelles épreuves composent le pentathle ?",["Disque, saut, javelot, course, lutte","Course, boxe, lutte, pancrace, saut","Disque, javelot, arc, lutte, boxe","Stade, double stade, course longue, lutte, boxe"],"C'est l'épreuve de l'athlète le plus complet, à élimination."],
["H","CM1","Qui peut participer aux JO antiques ?",["Les hommes nés grecs de parents libres","Tous les hommes libres","Les hommes et les femmes grecs","Seulement les aristocrates"],"Les femmes concourent à part aux Héraïa."],
["H","CM2","Que désigne « païdagogos » ?",["L'esclave qui conduit l'enfant à l'école","Le maître d'école","Le professeur de gymnastique","Le directeur du gymnase"],"Païdos + agôgè : conduire l'enfant."],
["H","CM2","Que signifie « gymnos » ?",["Nu : le gymnase est le lieu des exercices nus","Lutte","Course","Jeune"],"La nudité symbolise la beauté, la pureté et le refus de la triche."],
["H","CM2","Que désigne le « kaloskagathos » ?",["Beau et brave : l'idéal de l'athlète","Le propriétaire du gymnase","L'épreuve finale de Sparte","Le racloir"],"Athlète nu, imberbe, musclé, ni gros ni maigre."],
["H","CM2","En quoi consiste la cryptie spartiate ?",["Survivre un an en volant sans se faire surprendre","Un défilé public des filles","Un concours de course","Le service militaire de 2 ans"],"Épreuve finale pour les plus endurcis de l'agogè."],
["H","CM2","Qui est citoyen à Athènes ?",["Un homme libre né de père et de mère athéniens","Tout habitant adulte","Les hommes et les femmes nés à Athènes","Les seuls riches évergètes"],"Femmes, esclaves et métèques n'ont aucun droit politique."],
["H","CM3","Que sont les ludi ?",["Des spectacles de jeux et de compétitions liés aux fêtes des dieux","Les exercices des citoyens","Les bains publics","Les lois de la République"],"Ils passent de 76 jours par an à 175 à la fin de l'Empire."],
["H","CM3","Quelles couleurs de factions dans les courses de chars ?",["Blancs, rouges, bleus et verts","Rouge et noir","Jaune et vert","Bleu et blanc"],"Les bleus sont ceux des patriciens, les verts ceux de la plèbe."],
["H","CM3","Combien de tours de piste dure une course de chars ?",["7 tours","3 tours","12 tours","24 tours"],"C'est l'épreuve reine du Circus Maximus."],
["H","CM3","Qu'est-ce que la naumachie ?",["Une bataille navale reconstituée sur un bassin artificiel","Un combat contre des animaux","Un bain froid","Une course de chars"],"Elle fait partie des spectacles qui rappellent la puissance de l'Empire."],
["H","CM3","Que sont les venationes ?",["Des chasses : luttes contre des animaux sauvages","Des combats funéraires","Des courses de chars","Des pièces de théâtre"],"Elles s'ajoutent aux combats de gladiateurs au programme."],
["H","CM4","À quoi servent les étriers et la selle à piquer ?",["À faire corps avec la monture et ne pas être désarçonné","À ralentir le cheval","À porter l'armure","À protéger le cheval"],"Le cheval devient un point d'appui pour la lance."],
["H","CM4","Qu'est-ce que l'adoubement ?",["La cérémonie où le seigneur fait chevalier (la colée, armes, éperons)","Le serment du page","Un tournoi","L'entraînement de l'écuyer"],"Après une nuit de prière ; forte connotation chrétienne."],
["H","CM4","Pourquoi la chasse à courre prépare-t-elle à la guerre ?",["Équitation, armes, endurance et organisation collective","Elle rapporte des prisonniers","Elle est interdite aux nobles","Elle se fait à pied sans armes"],"Gaston Phébus distingue les « bestes rouges » et les « bestes noires »."],
["H","CM4","Qu'est-ce que le combat à la barrière ?",["Un duel de part et d'autre d'une balustrade","Un jeu de précision","Une chasse","Un combat collectif sans limite"],"Il se fait à pied, à l'épée ou à la hache."],
["H","CM4","Que traduit l'évolution des joutes selon Elias ?",["Un processus de civilisation des mœurs","Une brutalisation croissante","La naissance immédiate du sport moderne","La fin des tribunes"],"Le cours précise que ce processus ne mène pas immédiatement au sport."],
["S","Intro","Quelle question pose la sociologie de Weber ?",["Pourquoi les individus agissent-ils ainsi ?","Comment la société agit-elle sur eux ?","Comment mesurer le sport ?","Qui a inventé le sport ?"],"Elle cherche le sens subjectif de l'activité sociale."],
["S","Intro","Selon Defrance, que fait-on quand on définit le sport ?",["On inclut et on exclut","On mesure la performance","On fixe son histoire","On choisit un club"],"Définir trace des frontières, avec des enjeux pratiques et scientifiques."],
["S","Intro","Quelles méthodes sont quantitatives ?",["Questionnaires et analyses statistiques","Entretiens et observation","Enquête ethnographique","Analyse documentaire"],"Les autres sont des méthodes qualitatives."],
["S","Intro","À partir de quand la sociologie s'intéresse-t-elle vraiment au sport ?",["Années 1950-1970","XIXe siècle","Années 2010","Antiquité"],"D'abord le monde anglo-américain, puis l'Europe ; STAPS se structure en 1975."],
["S","Intro","Qui affirme que la connaissance du sport est une connaissance de la société ?",["Elias et Dunning","Parlebas","Weber","Hébert"],"Le sport est un révélateur des normes et des inégalités."],
["S","Intro","Selon le baromètre 2025, que dit le diplôme de la pratique régulière ?",["70 % chez les bac et plus, 52 % en dessous","Aucune différence","Plus chez les moins diplômés","Plus chez les 60 ans et plus"],"Les inégalités sociales restent importantes."],
["S","Inst","Pourquoi organise-t-on méthodiquement les épreuves vers 1850 ?",["Pour rendre possibles les paris sur le résultat","Pour préparer les JO","Pour l'école obligatoire","Pour la télévision"],"Le sport est d'abord un amusement d'adultes autorisant les paris."],
["S","Inst","Quel rôle jouent les public schools ?",["Elles codifient et organisent les jeux physiques anglais","Elles interdisent le football","Elles financent les paris","Elles créent les fédérations"],"Écoles privées des élites britanniques."],
["S","Inst","Que sont les folk games ?",["Des jeux traditionnels locaux aux règles variables","Des sports codifiés","Des jeux scolaires","Des compétitions professionnelles"],"Exemples : mob football, knappan gallois, hurling de Cornouailles."],
["S","Inst","Que réintroduit la « re-sportivisation » du MMA ?",["Règles, catégories de poids et gants","L'absence de règles","L'interdiction du pay-per-view","La suppression des arbitres"],"Pour faire reconnaître les combats comme rencontres sportives légitimes."],
["S","Inst","Que montre le cas du break (Lessard et Demain Gan) ?",["Une sportification relative déjà engagée dans les années 1990","Une sportification due aux seuls JO","Aucune sportification","Une fédéralisation dès 1984"],"Les JO sont une nouvelle étape, pas le début."],
["S","Struc","Quel ministère assure l'éducation physique et sportive ?",["Le ministère de l'Éducation nationale","Le CNOSF","Les clubs","Les entreprises"],"Le ministère des Sports coordonne et contrôle la gestion du sport."],
["S","Struc","Qui forme le cœur du secteur privé non marchand ?",["Les associations sportives (licenciés, bénévoles)","Les salles de fitness","Les ministères","Les sponsors"],"Logique non lucrative."],
["S","Struc","À quoi participent les fédérations agréées ?",["À une mission de service public","À aucune mission","À la gestion des salles privées","À la vente d'équipements"],"Certaines reçoivent une délégation pour organiser une discipline."],
["S","Struc","Laure et Falcoz croisent les secteurs avec quoi ?",["Les références dominantes (éthique sportive, éducation, mercantile, hédoniste, santé)","L'âge des pratiquants","Les régions","Les sports"],"Ce croisement donne six « mondes » du sport."],
["S","Struc","Les six mondes du sport sont-ils cloisonnés ?",["Non : plus ou moins connectés","Oui, étanches","Oui, par secteur","Non, ils sont identiques"],"Ils forment un système de mondes différenciés mais interdépendants."],

const $=document.getElementById("app");
let sel="CM1",miss=new Set(),run=null;
try{miss=new Set(JSON.parse(localStorage.getItem("qcmMiss")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("qcmMiss",JSON.stringify([...miss]))}catch(e){}};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function home(){
 const n=Q.filter(q=>q[1]===sel).length,m=[...miss].filter(i=>Q[i]&&Q[i][1]===sel).length;
 $.innerHTML=`<h1>QCM <span>STAPS L1</span></h1><p class="mut">Histoire et sociologie du sport, d'après les cours de Toulouse. Choisissez un seul thème à réviser.</p>`+
 Object.entries(G).map(([k,mt])=>`<h2>${mt.n}</h2><div class="chips">${Object.entries(mt.c).map(([c,l])=>`<button class="chip" data-c="${c}" aria-pressed="${sel===c}">${l}</button>`).join("")}</div>`).join("")+
 `<button class="btn" id="go" ${n?"":"disabled"}>Commencer (${n} questions)</button>
 <button class="btn alt" id="rev" ${m?"":"disabled"}>Réviser mes erreurs (${m})</button>`;
 $.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{sel=b.dataset.c;home()});
 $.querySelector("#go").onclick=()=>start(Q.map((q,i)=>i).filter(i=>Q[i][1]===sel));
 $.querySelector("#rev").onclick=()=>start([...miss].filter(i=>Q[i]&&Q[i][1]===sel));
}
function start(ids){run={ids:shuf(ids),k:0,score:0,wrong:[]};ask()}
function ask(){
 const i=run.ids[run.k],q=Q[i],opts=shuf(q[3].map((t,j)=>[t,j===0]));
 $.innerHTML=`<div class="top"><span class="tag">${G[q[0]].c[q[1]]}</span><button class="lnk" id="quit">Quitter</button></div>
 <div class="bar"><i style="width:${run.k/run.ids.length*100}%"></i></div>
 <p class="tag">Question ${run.k+1} sur ${run.ids.length}</p><div class="q">${q[2]}</div><div id="o"></div><div id="f"></div>`;
 $.querySelector("#quit").onclick=home;
 const box=$.querySelector("#o");
 opts.forEach(([t,ok])=>{const b=document.createElement("button");b.className="opt";b.textContent=t;
  b.onclick=()=>{box.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(opts[j][1])x.classList.add("good")});
   if(ok){run.score++;miss.delete(i)}else{b.classList.add("bad");run.wrong.push(i);miss.add(i)}save();
   const last=run.k+1===run.ids.length;
   $.querySelector("#f").innerHTML=`<div class="fb"><b>${ok?"Bonne réponse.":"Pas tout à fait."}</b>${ok?"":`<p>Vous avez répondu : ${t}</p>`}<p><b>Réponse attendue :</b> ${q[3][0]}</p><p><b>À retenir :</b> ${q[4]}</p>${D[i]?`<p><b>Pour aller plus loin :</b> ${D[i]}</p>`:""}<p class="ex"><b>Extrait du cours</b> (${X[i][0]}) :<br>« ${X[i][1]} »</p><p class="tag">À ne pas confondre avec : ${q[3].slice(1).join(" ; ")}</p><p class="tag">À revoir : ${G[q[0]].c[q[1]]}</p></div><button class="btn" id="nx">${last?"Voir mon score":"Question suivante"}</button>`;
   const nx=$.querySelector("#nx");nx.focus();nx.onclick=()=>{run.k++;last?end():ask()}};
  box.appendChild(b)});
}
function end(){
 const n=run.ids.length;
 $.innerHTML=`<h1>Résultat</h1><div class="score">${run.score}/${n}</div><p class="mut">${run.score===n?"Sans faute, bravo !":run.score>=n*.7?"Solide. Reprenez les erreurs ci-dessous.":"Pas de panique : relisez les cours puis réessayez avec le mode révision."}</p>`+
 (run.wrong.length?`<h2>À retravailler</h2>`+run.wrong.map(i=>`<div class="miss"><b>${Q[i][2]}</b><span class="a">${Q[i][3][0]}</span><br><span class="mut">${Q[i][4]}<br>${D[i]||""}</span><span class="ex">Extrait du cours (${X[i][0]}) : « ${X[i][1]} »</span></div>`).join(""):"")+
 `<button class="btn" id="rv" ${run.wrong.length?"":"disabled"}>Réviser ces erreurs</button><button class="btn alt" id="hm">Retour à l'accueil</button>`;
 $.querySelector("#rv").onclick=()=>start(run.wrong);$.querySelector("#hm").onclick=home;
}
home();
